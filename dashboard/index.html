<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>SMOB Торговая панель</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --page: #F0F2F7;
      --white: #FFFFFF;
      --border: #E5E7EB;
      --border-light: #F3F4F6;
      --text: #111827;
      --text-md: #374151;
      --text-muted: #6B7280;
      --text-light: #9CA3AF;
      --amber: #D97706;
      --amber-mid: #F59E0B;
      --amber-bg: #FFFBEB;
      --amber-border: #FDE68A;
      --green: #059669;
      --green-bg: #ECFDF5;
      --green-border: #A7F3D0;
      --red: #DC2626;
      --red-bg: #FEF2F2;
      --red-border: #FECACA;
      --blue: #2563EB;
      --blue-bg: #EFF6FF;
      --blue-border: #BFDBFE;
      --shadow: 0 10px 24px rgba(17, 24, 39, .06);
      --font: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
    }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--page);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      letter-spacing: 0;
      overflow-x: hidden;
    }
    button, input, select { font: inherit; }
    button {
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--white);
      color: var(--text);
      cursor: pointer;
    }
    .mono { font-family: var(--mono); }
    .app {
      display: flex;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }
    .sidebar {
      width: 220px;
      flex: 0 0 220px;
      height: 100vh;
      background: var(--white);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .brand {
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border-light);
    }
    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #1C1F2A;
      color: var(--amber-mid);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 16px;
    }
    .brand-title { font-size: 13px; font-weight: 800; line-height: 1.1; }
    .brand-subtitle { margin-top: 2px; color: var(--text-muted); font-size: 10px; }
    .nav {
      padding: 12px 10px;
      display: grid;
      gap: 14px;
    }
    .nav-group { display: grid; gap: 4px; }
    .nav-group-title {
      padding: 6px 10px;
      color: var(--text-light);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .nav-item {
      min-height: 36px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 10px;
      border-radius: 10px;
      color: var(--text-md);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
    }
    .nav-item:hover { background: var(--border-light); color: var(--text); }
    .nav-item.active {
      background: var(--amber-bg);
      color: var(--amber);
      font-weight: 700;
    }
    .nav-icon {
      width: 20px;
      color: inherit;
      font-size: 13px;
      text-align: center;
    }
    .sidebar-footer {
      margin-top: auto;
      padding: 14px 18px 18px;
      border-top: 1px solid var(--border-light);
      color: var(--text-muted);
      font-size: 10px;
      line-height: 1.6;
    }
    .online-row {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--green);
      font-weight: 700;
      margin-bottom: 6px;
    }
    .online-dot { width: 7px; height: 7px; border-radius: 999px; background: var(--green); }
    .main {
      flex: 1;
      min-width: 0;
      height: 100vh;
      background: var(--page);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .topbar {
      height: 50px;
      flex: 0 0 50px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 18px;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .mobile-logo {
      display: none;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: #1C1F2A;
      color: var(--amber-mid);
      place-items: center;
      font-weight: 800;
    }
    .page-title {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 11px;
      white-space: nowrap;
    }
    .badge {
      min-height: 26px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 0 10px;
      border: 1px solid var(--border);
      background: var(--white);
      font-weight: 700;
    }
    .badge.green { color: var(--green); background: var(--green-bg); border-color: var(--green-border); }
    .badge.amber { color: var(--amber); background: var(--amber-bg); border-color: var(--amber-border); }
    .badge.red { color: var(--red); background: var(--red-bg); border-color: var(--red-border); }
    .badge.blue { color: var(--blue); background: var(--blue-bg); border-color: var(--blue-border); }
    .content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 14px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .stat-card, .panel {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      min-width: 0;
    }
    .stat-card {
      min-height: 128px;
      padding: 14px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 126px;
      gap: 8px;
      align-items: end;
    }
    .stat-label {
      color: var(--text-muted);
      font-size: 10px;
      line-height: 1;
      font-weight: 800;
      text-transform: uppercase;
    }
    .stat-value {
      margin-top: 9px;
      color: var(--amber);
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 800;
      line-height: 1.1;
      white-space: nowrap;
    }
    .stat-value.green { color: var(--green); }
    .stat-value.red { color: var(--red); }
    .stat-value.blue { color: var(--blue); }
    .stat-sub {
      margin-top: 5px;
      color: var(--text-muted);
      font-size: 10px;
      min-height: 14px;
    }
    .mini-badge {
      margin-top: 9px;
      display: inline-flex;
      max-width: 100%;
      min-height: 22px;
      align-items: center;
      border-radius: 999px;
      padding: 0 8px;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mini-badge.amber { color: var(--amber); background: var(--amber-bg); border: 1px solid var(--amber-border); }
    .mini-badge.green { color: var(--green); background: var(--green-bg); border: 1px solid var(--green-border); }
    .mini-badge.red { color: var(--red); background: var(--red-bg); border: 1px solid var(--red-border); }
    .mini-badge.blue { color: var(--blue); background: var(--blue-bg); border: 1px solid var(--blue-border); }
    .sparkline {
      width: 120px;
      height: 32px;
      align-self: center;
      justify-self: end;
      overflow: visible;
    }
    .content-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: 12px;
      align-items: start;
    }
    .panel { padding: 14px; }
    .panel-header {
      min-height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .panel-title { font-weight: 800; font-size: 13px; }
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border-radius: 999px;
      padding: 0 8px;
      color: var(--text-muted);
      background: var(--border-light);
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }
    .trade-list { display: grid; gap: 2px; }
    .trade-row {
      min-height: 42px;
      display: grid;
      grid-template-columns: 62px 48px minmax(74px, 1fr) 44px 70px;
      align-items: center;
      gap: 8px;
      border-top: 1px solid var(--border-light);
      font-size: 11px;
    }
    .trade-row:first-child { border-top: 0; }
    .symbol {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 800;
      color: var(--text);
    }
    .side-badge {
      min-height: 20px;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 7px;
      font-size: 10px;
      font-weight: 800;
    }
    .side-badge.buy, .side-badge.long { color: var(--green); background: var(--green-bg); border: 1px solid var(--green-border); }
    .side-badge.sell, .side-badge.short { color: var(--red); background: var(--red-bg); border: 1px solid var(--red-border); }
    .price-flow {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tp-dots { display: flex; gap: 4px; }
    .tp-dot {
      width: 6px;
      height: 6px;
      border-radius: 2px;
      background: var(--border);
    }
    .tp-dot.done { background: var(--green); }
    .pnl {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 800;
      text-align: right;
      white-space: nowrap;
    }
    .green-text { color: var(--green); }
    .red-text { color: var(--red); }
    .amber-text { color: var(--amber); }
    .blue-text { color: var(--blue); }
    .bias-hero {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin: 4px 0 10px;
    }
    .bias-direction {
      font-size: 28px;
      line-height: 1;
      font-weight: 800;
      color: var(--green);
    }
    .bias-direction.short { color: var(--red); }
    .bias-confidence {
      font-family: var(--mono);
      color: var(--amber);
      font-size: 16px;
      font-weight: 800;
    }
    .progress {
      width: 100%;
      height: 5px;
      overflow: hidden;
      background: var(--border-light);
      border-radius: 999px;
      margin-bottom: 10px;
    }
    .progress span { display: block; height: 100%; border-radius: inherit; background: var(--amber-mid); }
    .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      max-width: 100%;
      min-height: 22px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 0 8px;
      background: var(--border-light);
      color: var(--text-md);
      font-size: 10px;
      font-weight: 700;
    }
    .risk-list { display: grid; gap: 8px; }
    .risk-row {
      min-height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-light);
      gap: 12px;
    }
    .risk-row:last-child { border-bottom: 0; }
    .risk-row span { color: var(--text-muted); font-size: 11px; }
    .risk-row b { font-family: var(--mono); font-size: 11px; text-align: right; }
    .empty {
      min-height: 130px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      border: 1px dashed var(--border);
      border-radius: 14px;
      background: #FAFBFC;
      padding: 18px;
    }
    .skeleton-page {
      min-height: calc(100vh - 92px);
      display: grid;
      place-items: center;
    }
    .skeleton-box {
      width: min(520px, 100%);
      min-height: 210px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
    }
    .skeleton-box h2 { margin: 0 0 8px; font-size: 18px; }
    .skeleton-box p { margin: 0; color: var(--text-muted); }
    .loading {
      min-height: calc(100vh - 92px);
      display: grid;
      place-items: center;
      color: var(--text-muted);
    }
    .bottom-nav { display: none; }
    .endpoint-error {
      margin-bottom: 10px;
      color: var(--red);
      background: var(--red-bg);
      border: 1px solid var(--red-border);
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 11px;
    }
    .refresh-button {
      min-height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      color: var(--amber);
      background: var(--amber-bg);
      border-color: var(--amber-border);
      font-size: 11px;
      font-weight: 800;
    }
    .page-grid { display: grid; gap: 12px; }
    .cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .wide-grid { grid-template-columns: 1.25fr .75fr; }
    .stack { display: grid; gap: 8px; }
    .kv-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .kv-card {
      min-height: 62px;
      border: 1px solid var(--border-light);
      border-radius: 12px;
      background: #FAFBFC;
      padding: 10px;
    }
    .kv-card span, .kv-row span {
      display: block;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      margin-bottom: 5px;
    }
    .kv-card b {
      display: block;
      min-width: 0;
      overflow-wrap: anywhere;
      font-family: var(--mono);
      font-size: 13px;
    }
    .kv-row {
      min-height: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border-light);
      color: var(--text-md);
    }
    .kv-row:last-child { border-bottom: 0; }
    .kv-row span { margin-bottom: 0; }
    .kv-row b {
      min-width: 0;
      text-align: right;
      overflow-wrap: anywhere;
      font-family: var(--mono);
      font-size: 11px;
    }
    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th {
      color: var(--text-muted);
      font-size: 10px;
      text-align: left;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      padding: 9px 8px;
      white-space: nowrap;
    }
    td {
      border-bottom: 1px solid var(--border-light);
      padding: 9px 8px;
      vertical-align: middle;
    }
    .desktop-table { display: block; }
    .mobile-cards { display: none; }
    .compact-list { display: grid; gap: 8px; }
    .compact-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--white);
      padding: 12px;
      box-shadow: var(--shadow);
    }
    .compact-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    .chart-box {
      width: 100%;
      min-height: 220px;
      border: 1px solid var(--border-light);
      border-radius: 14px;
      background: #FAFBFC;
      overflow: hidden;
    }
    .chart-box svg { width: 100%; height: 220px; display: block; }
    .position-card {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--white);
      box-shadow: var(--shadow);
      padding: 14px;
      min-width: 0;
    }
    .position-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .period-switcher {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .period-button {
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--text-muted);
      font-weight: 700;
      font-size: 12px;
    }
    .period-button.active {
      background: var(--text);
      color: var(--white);
      border-color: var(--text);
    }
    select {
      min-height: 38px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--white);
      color: var(--text);
      padding: 0 10px;
    }
    .bar-list { display: grid; gap: 8px; }
    .bar-row {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) 86px;
      gap: 8px;
      align-items: center;
      font-size: 11px;
    }
    .bar-track {
      height: 8px;
      border-radius: 999px;
      background: var(--border-light);
      overflow: hidden;
    }
    .bar-fill { height: 100%; border-radius: inherit; background: var(--green); }
    .bar-fill.negative { background: var(--red); }
    @media (max-width: 1023px) {
      .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .content-grid { grid-template-columns: 1fr; }
      .cols-2, .cols-3, .cols-4, .wide-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .app { height: auto; min-height: 100vh; overflow: visible; }
      .sidebar { display: none; }
      .main { min-height: 100vh; height: auto; padding-bottom: 68px; overflow: visible; }
      .topbar { position: sticky; top: 0; z-index: 10; padding: 0 12px; }
      .mobile-logo { display: grid; }
      .page-title { display: none; }
      .topbar-right .badge { display: none; }
      .topbar-right .refresh-button { display: inline-flex; align-items: center; min-width: 44px; justify-content: center; padding: 0 8px; }
      .topbar-right #clock { display: inline; font-family: var(--mono); font-weight: 700; color: var(--text); }
      .content { padding: 12px; overflow: visible; }
      .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .stat-card { grid-template-columns: 1fr; min-height: 142px; padding: 12px; }
      .sparkline { width: 100%; max-width: 150px; justify-self: start; }
      .content-grid { grid-template-columns: 1fr; }
      .trade-row {
        min-height: 70px;
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "symbol pnl"
          "side dots"
          "price price";
        padding: 9px 0;
      }
      .trade-row .symbol { grid-area: symbol; }
      .trade-row .side-badge { grid-area: side; width: fit-content; }
      .trade-row .price-flow { grid-area: price; }
      .trade-row .tp-dots { grid-area: dots; justify-self: end; }
      .trade-row .pnl { grid-area: pnl; }
      .desktop-table { display: none; }
      .mobile-cards { display: block; }
      .kv-grid { grid-template-columns: 1fr; }
      .bottom-nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 30;
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        min-height: 58px;
        background: var(--white);
        border-top: 1px solid var(--border);
        box-shadow: 0 -8px 24px rgba(17, 24, 39, .08);
      }
      .bottom-nav button {
        min-height: 58px;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        background: transparent;
        color: var(--text-muted);
        font-size: 10px;
        font-weight: 800;
        display: grid;
        place-items: center;
        gap: 2px;
      }
      .bottom-nav button.active { color: var(--amber); background: var(--amber-bg); }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">S</div>
        <div>
          <div class="brand-title">SMOB</div>
          <div class="brand-subtitle">Торговая панель</div>
        </div>
      </div>
      <nav class="nav" id="nav" aria-label="Навигация"></nav>
      <div class="sidebar-footer">
        <div class="online-row"><span class="online-dot"></span><span>MT5 · Online</span></div>
        <div id="sidebar-time">—</div>
        <div id="sidebar-bots">Боты: —</div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <div class="mobile-logo">S</div>
          <h1 class="page-title" id="page-title">Главная</h1>
        </div>
        <div class="topbar-right">
          <span class="badge green">● Render Live</span>
          <span class="badge amber" id="topbar-bias">Байес: —</span>

          <span id="clock">—</span>
        </div>

      <section class="content" id="content"></section>
    </main>
  </div>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Мобильная навигация"></nav>

  <script>
    const DASHBOARD_VERSION = 'smob-minimal-2026-05';
    const REFRESH_MS = 30000;
    const ROUTES = [
      {id:'overview', path:'overview', label:'Главная', group:'Обзор', icon:'⌂'},
      {id:'portfolio', path:'portfolio', label:'Счёт', group:'Обзор', icon:'€'},
      {id:'positions', path:'positions', label:'Позиции', group:'Обзор', icon:'◈'},
      {id:'trades', path:'trades', label:'Сделки', group:'Торговля', icon:'↕'},
      {id:'history', path:'history', label:'История', group:'Торговля', icon:'◷'},
      {id:'signals', path:'signals', label:'Сигналы', group:'Торговля', icon:'⚡'},
      {id:'bias', path:'bias', label:'Байес', group:'Анализ', icon:'↗'},
      {id:'analytics', path:'analytics', label:'Статистика', group:'Анализ', icon:'▦'},
      {id:'risk', path:'risk', label:'Риск', group:'Анализ', icon:'!'},
      {id:'lab', path:'lab', label:'Лаборатория стратегии', group:'Анализ', icon:'◌'},
      {id:'sources', path:'sources', label:'Источники', group:'Система', icon:'◎'},
      {id:'storage', path:'storage', label:'Хранилище', group:'Система', icon:'▣'},
      {id:'settings', path:'settings', label:'Система', group:'Система', icon:'⚙'}
    ];
    const MOBILE_NAV = [
      {id:'overview', label:'Главная', icon:'⌂'},
      {id:'trades', label:'Сделки', icon:'↕'},
      {id:'bias', label:'Байес', icon:'↗'},
      {id:'signals', label:'Сигналы', icon:'⚡'},
      {id:'analytics', label:'Анализ', icon:'▦'}
    ];
    const routeById = Object.fromEntries(ROUTES.map(route => [route.id, route]));
    const endpointList = [
      '/api/health',
      '/api/dashboard/status',
      '/api/dashboard/system',
      '/api/dashboard/account',
      '/api/dashboard/account-history',
      '/api/dashboard/positions',
      '/api/dashboard/trades',
      '/api/dashboard/signals',
      '/api/dashboard/signals/sources',
      '/api/dashboard/signals/accuracy',
      '/api/dashboard/stats',
      '/api/dashboard/bots',
      '/api/dashboard/bias',
      '/api/dashboard/bias/live',
      '/api/dashboard/bias/live/history',
      '/api/dashboard/bias/live/accuracy',
      '/api/dashboard/bias/live/calibration',
      '/api/dashboard/strategy-lab',
      '/api/dashboard/strategy-lab/recommendations',
      '/api/dashboard/strategy-lab/data-health',
      '/api/dashboard/storage-health'
    ];
    const endpoints = {
      health: '/api/health',
      status: '/api/dashboard/status',
      system: '/api/dashboard/system',
      account: '/api/dashboard/account',
      accountHistory: '/api/dashboard/account-history?limit=500',
      positions: '/api/dashboard/positions',
      trades: '/api/dashboard/trades?source=bot&period=all&asset=ALL&limit=500',
      signals: '/api/dashboard/signals?limit=200',
      signalSources: '/api/dashboard/signals/sources',
      signalAccuracy: '/api/dashboard/signals/accuracy?limit=1000',
      stats: '/api/dashboard/stats?source=bot&period=all&asset=ALL',
      statsToday: '/api/dashboard/stats?source=bot&period=today&asset=ALL',
      pnl: '/api/dashboard/pnl?period=today',
      bots: '/api/dashboard/bots',
      bias: '/api/dashboard/bias',
      biasLive: '/api/dashboard/bias/live',
      biasLiveHistory: '/api/dashboard/bias/live/history?limit=80',
      biasLiveAccuracy: '/api/dashboard/bias/live/accuracy?limit=5000',
      biasLiveCalibration: '/api/dashboard/bias/live/calibration?limit=5000',
      lab: '/api/dashboard/strategy-lab',
      labRecs: '/api/dashboard/strategy-lab/recommendations',
      labHealth: '/api/dashboard/strategy-lab/data-health',
      storage: '/api/dashboard/storage-health',
      events: '/api/dashboard/events?limit=80',
      performance: '/api/dashboard/performance?period=all'
    };
    const state = {
      route: 'overview',
      data: {},
      errors: {},
      loading: true,
      lastUpdate: null,
      filters: {symbol:'ALL', result:'ALL', source:'ALL', period:'day'}
    };

    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const arr = value => Array.isArray(value) ? value : [];
    const obj = value => value && typeof value === 'object' ? value : {};
    const num = value => {
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : null;
    };
    const dash = value => value === null || value === undefined || value === '' ? '—' : value;
    const money = value => {
      const n = num(value);
      if (n === null) return '—';
      const sign = n > 0 ? '+' : n < 0 ? '-' : '';
      return `${sign}€${Math.abs(n).toLocaleString('ru-RU', {minimumFractionDigits:2, maximumFractionDigits:2})}`;
    };
    const price = value => {
      const n = num(value);
      return n === null ? '—' : n.toLocaleString('ru-RU', {minimumFractionDigits:2, maximumFractionDigits:2});
    };
    const pct = value => {
      const n = num(value);
      return n === null ? '—' : `${n.toFixed(Math.abs(n) >= 10 ? 0 : 1)}%`;
    };
    const signedClass = value => {
      const n = num(value);
      return n > 0 ? 'green-text' : n < 0 ? 'red-text' : 'blue-text';
    };
    const dateTime = value => {
      if (!value) return '—';
      const parsed = new Date(String(value).replace(' ', 'T'));
      if (Number.isNaN(parsed.getTime())) return String(value);
      return parsed.toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
    };
    const first = (...values) => values.find(value => value !== null && value !== undefined && value !== '');
    const periodLabels = {day:'Сегодня', week:'Неделя', month:'Месяц', all:'Всё время'};
    const statusLabels = {
      VALID_SIGNAL:'Подтверждён',
      WATCH_ONLY:'Наблюдать',
      WAIT_CONFIRMATION:'Наблюдать',
      REJECTED:'Отклонён',
      DUPLICATE:'Отклонён',
      EXPIRED:'Истёк',
      correct:'Правильно',
      wrong:'Ошибка',
      neutral:'Нейтрально',
      not_enough_data:'Недостаточно данных',
      pending:'Ожидает',
      win:'Плюс',
      loss:'Минус',
      breakeven:'BE',
      open:'Открыта'
    };
    const statusRu = value => statusLabels[String(value ?? '')] || dash(value);
    function rowTimestamp(row) {
      return first(row.timestamp, row.closed_at, row.close_time, row.opened_at, row.open_time, row.time, row.created_at);
    }
    function periodStart(period) {
      const now = new Date();
      if (period === 'day') return new Date(now.getFullYear(), now.getMonth(), now.getDate());
      if (period === 'week') return new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
      if (period === 'month') return new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
      return null;
    }
    function inSelectedPeriod(row) {
      const start = periodStart(state.filters.period);
      if (!start) return true;
      const stamp = rowTimestamp(row);
      if (!stamp) return false;
      const parsed = new Date(String(stamp).replace(' ', 'T'));
      return !Number.isNaN(parsed.getTime()) && parsed >= start;
    }
    function periodSwitcher() {
      return `<div class="period-switcher">${Object.entries(periodLabels).map(([key, label]) => `
        <button type="button" class="period-button ${state.filters.period === key ? 'active' : ''}" data-period="${key}">${label}</button>
      `).join('')}</div>`;
    }

    function initialRoute() {
      const hash = window.location.hash.replace('#', '').replace('/', '');
      if (routeById[hash]) return hash;
      const path = window.location.pathname.replace(/^\/dashboard\/?/, '').replace('/', '');
      return routeById[path] ? path : 'overview';
    }

    function setRoute(routeId) {
      state.route = routeById[routeId] ? routeId : 'overview';
      if (window.location.hash.replace('#', '') !== state.route) window.location.hash = state.route;
      render();
    }

    async function api(key, path, fallback) {
      try {
        const response = await fetch(path, {cache:'no-store'});
        if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
        const data = await response.json();
        delete state.errors[key];
        return data;
      } catch (error) {
        state.errors[key] = error.message || 'endpoint unavailable';
        return fallback;
      }
    }

    async function refreshAll() {
      state.loading = true;
      render();
      const results = await Promise.all([
        api('health', endpoints.health, {ok:false}),
        api('status', endpoints.status, {ok:false}),
        api('system', endpoints.system, {ok:false}),
        api('account', endpoints.account, {ok:true, account:null}),
        api('accountHistory', endpoints.accountHistory, {ok:true, snapshots:[]}),
        api('positions', endpoints.positions, {ok:true, positions:[]}),
        api('trades', endpoints.trades, {ok:true, trades:[], total:0}),
        api('signals', endpoints.signals, {ok:true, signals:[]}),
        api('signalSources', endpoints.signalSources, {ok:true, sources:[]}),
        api('signalAccuracy', endpoints.signalAccuracy, {ok:true, overall:{}, by_symbol:{}, by_source:{}, by_setup:{}}),
        api('stats', endpoints.stats, {ok:true, stats:{}}),
        api('statsToday', endpoints.statsToday, {ok:true, stats:{}}),
        api('pnl', endpoints.pnl, {ok:true, pnl:{}}),
        api('bots', endpoints.bots, {ok:true, bots:[]}),
        api('bias', endpoints.bias, {ok:true, bias:null}),
        api('biasLive', endpoints.biasLive, {ok:true, bias:null}),
        api('biasLiveHistory', endpoints.biasLiveHistory, {ok:true, history:[]}),
        api('biasLiveAccuracy', endpoints.biasLiveAccuracy, {ok:true, overall:{}, by_symbol:{}, by_confidence_bucket:{}}),
        api('biasLiveCalibration', endpoints.biasLiveCalibration, {ok:true, recommended_weight_adjustments:[], requires_human_approval:true}),
        api('lab', endpoints.lab, {ok:false, trade_count:0}),
        api('labRecs', endpoints.labRecs, {ok:false}),
        api('labHealth', endpoints.labHealth, {ok:false, trade_count:0}),
        api('storage', endpoints.storage, {ok:false, warnings:['storage_unavailable']}),
        api('events', endpoints.events, {ok:true, events:[]}),
        api('performance', endpoints.performance, {ok:true, items:[], totals:{}})
      ]);
      [
        'health','status','system','account','accountHistory','positions','trades','signals','signalSources','signalAccuracy','stats','statsToday','pnl','bots',
        'bias','biasLive','biasLiveHistory','biasLiveAccuracy','biasLiveCalibration','lab','labRecs','labHealth','storage','events','performance'
      ].forEach((key, index) => state.data[key] = results[index]);
      state.loading = false;
      state.lastUpdate = new Date();
      render();
    }

    function account() { return obj(obj(state.data.account).account); }
    function accountSnapshots() { return arr(obj(state.data.accountHistory).snapshots); }
    function positions() { return arr(obj(state.data.positions).positions); }
    function trades() { return arr(obj(state.data.trades).trades); }
    function stats() { return obj(obj(state.data.stats).stats); }
    function statsToday() { return obj(obj(state.data.statsToday).stats); }
    function pnl() { return obj(obj(state.data.pnl).pnl); }
    function bots() { return arr(obj(state.data.bots).bots); }
    function lab() { return obj(state.data.lab); }
    function labHealth() { return obj(state.data.labHealth); }
    function labRecs() { return obj(state.data.labRecs); }
    function storage() { return obj(state.data.storage); }
    function system() { return obj(state.data.system); }
    function health() { return obj(state.data.health); }
    function bias() { return obj(obj(state.data.bias).bias); }
    function liveBias() { return obj(obj(state.data.biasLive).bias); }
    function liveBiasRows() { return arr(liveBias().symbols); }
    function liveBiasAccuracy() { return obj(state.data.biasLiveAccuracy); }
    function liveBiasCalibration() { return obj(state.data.biasLiveCalibration); }
    function signalRows() { return arr(obj(state.data.signals).signals); }
    function signalSources() { return arr(obj(state.data.signalSources).sources); }
    function signalAccuracy() { return obj(state.data.signalAccuracy); }

    function renderNav() {
      const groups = ['Обзор', 'Торговля', 'Анализ', 'Система'];
      $('nav').innerHTML = groups.map(group => {
        const links = ROUTES.filter(route => route.group === group).map(route => `
          <a href="#${route.id}" class="nav-item ${state.route === route.id ? 'active' : ''}" data-route="${route.id}">
            <span class="nav-icon">${esc(route.icon)}</span><span>${esc(route.label)}</span>
          </a>`).join('');
        return `<div class="nav-group"><div class="nav-group-title">${esc(group)}</div>${links}</div>`;
      }).join('');
      document.querySelectorAll('[data-route]').forEach(link => {
        link.addEventListener('click', event => {
          event.preventDefault();
          setRoute(link.dataset.route);
        });
      });
    }

    function renderBottomNav() {
      const nav = $('bottom-nav');
      nav.innerHTML = MOBILE_NAV.map(item => `
        <button type="button" class="${state.route === item.id ? 'active' : ''}" data-mobile-route="${item.id}">
          <span>${esc(item.icon)}</span><span>${esc(item.label)}</span>
        </button>`).join('');
      nav.querySelectorAll('[data-mobile-route]').forEach(button => {
        button.addEventListener('click', () => setRoute(button.dataset.mobileRoute));
      });
    }

    function errorBlock(key) {
      return state.errors[key] ? `<div class="endpoint-error">${esc(state.errors[key])}</div>` : '';
    }

    function sparkline(values, tone='amber') {
      const width = 120, height = 32, pad = 2;
      const series = values.length ? values : [1, 1, 1, 1, 1, 1, 1, 1];
      const min = Math.min(...series), max = Math.max(...series), span = max - min || 1;
      const points = series.map((value, index) => {
        const x = pad + index * ((width - pad * 2) / Math.max(series.length - 1, 1));
        const y = height - pad - ((value - min) / span) * (height - pad * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
      const area = `0,${height} ${points} ${width},${height}`;
      const color = tone === 'green' ? '#059669' : tone === 'blue' ? '#2563EB' : tone === 'red' ? '#DC2626' : '#D97706';
      const id = `g${tone}${Math.round(Math.random() * 100000)}`;
      return `<svg class="sparkline" viewBox="0 0 ${width} ${height}" aria-hidden="true">
        <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
        <polygon points="${area}" fill="url(#${id})"></polygon>
        <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></polyline>
      </svg>`;
    }

    function pseudoTrend(seedValue, tone='amber') {
      const base = Math.abs(num(seedValue) ?? 1) || 1;
      const points = Array.from({length: 12}, (_, index) => {
        const wave = Math.sin((base + index * 17) / 13) * 0.06;
        const drift = (index - 5) * 0.012;
        return base * (1 + wave + drift);
      });
      return sparkline(points, tone);
    }

    function statCard(label, value, sub, badge, tone, seed) {
      return `<div class="stat-card">
        <div>
          <div class="stat-label">${esc(label)}</div>
          <div class="stat-value ${tone}">${value}</div>
          <div class="stat-sub">${esc(sub || '—')}</div>
          <div class="mini-badge ${tone || 'amber'}">${esc(badge || '—')}</div>
        </div>
        ${pseudoTrend(seed, tone || 'amber')}
      </div>`;
    }

    function openTradesCount() {
      const openFromTrades = trades().filter(row => String(row.status || row.state || '').toLowerCase().includes('open')).length;
      return positions().length || openFromTrades;
    }

    function bestSymbol() {
      const fromStats = first(stats().best_symbol, stats().best_asset, obj(lab().best_symbol).symbol);
      if (fromStats) return fromStats;
      const grouped = new Map();
      trades().forEach(row => {
        const symbol = row.symbol || '—';
        grouped.set(symbol, (grouped.get(symbol) || 0) + (num(first(row.net_profit, row.profit, row.total_net)) || 0));
      });
      return [...grouped.entries()].sort((a, b) => b[1] - a[1])[0]?.[0] || '—';
    }

    function worstSymbol() {
      const grouped = new Map();
      trades().forEach(row => {
        const symbol = row.symbol || '—';
        grouped.set(symbol, (grouped.get(symbol) || 0) + (num(first(row.net_profit, row.profit, row.total_net)) || 0));
      });
      return [...grouped.entries()].sort((a, b) => a[1] - b[1])[0]?.[0] || '—';
    }

    function statCards() {
      const acc = account();
      const s = stats();
      const p = pnl();
      const todayPnl = first(p.closed_pnl, p.net_pnl, statsToday().net_profit, 0);
      const activeBots = bots().filter(bot => String(first(bot.status, bot.state, '')).toLowerCase() !== 'paused').length || bots().length;
      const drawdown = first(s.max_drawdown, obj(lab().risk_damage_analytics).max_drawdown);
      const winRate = first(s.win_rate, s.winrate, obj(lab().risk_damage_analytics).winrate);
      const totalTrades = first(s.total_trades, trades().length);
      const avgR = first(s.avg_r, s.average_r, obj(lab().risk_damage_analytics).expectancy_R);
      return `<div class="stats-grid">
        ${statCard('БАЛАНС', money(acc.balance), `Equity: ${money(acc.equity)}`, `↑ ${money(todayPnl)} сегодня`, 'amber', acc.balance || acc.equity)}
        ${statCard('Win Rate', pct(winRate), `из ${dash(totalTrades)} сделок`, 'тренд по сделкам', 'green', winRate)}
        ${statCard('Открыто', dash(openTradesCount()), `позиции / ${dash(activeBots)} ботов активны`, `Drawdown: ${pct(drawdown)}`, num(drawdown) > 10 ? 'red' : 'blue', openTradesCount())}
        ${statCard('Avg R', avgR === undefined || avgR === null ? '—' : `${Number(avgR).toFixed(2)}R`, 'последние 30 сделок', `Best: ${bestSymbol()}`, 'green', avgR)}
      </div>`;
    }

    function tpDots(row) {
      return `<div class="tp-dots">${[1,2,3].map(index => `<span class="tp-dot ${row[`tp${index}_done`] || row[`tp${index}_hit`] ? 'done' : ''}"></span>`).join('')}</div>`;
    }

    function tradeRow(row) {
      const sideRaw = String(first(row.side, row.direction, row.type, '—')).toUpperCase();
      const side = sideRaw.includes('SELL') || sideRaw.includes('SHORT') ? 'SELL' : sideRaw.includes('BUY') || sideRaw.includes('LONG') ? 'BUY' : sideRaw;
      const profit = first(row.net_profit, row.profit, row.total_net, row.pnl);
      return `<div class="trade-row">
        <div class="symbol">${esc(row.symbol || '—')}</div>
        <div><span class="side-badge ${side === 'SELL' ? 'sell' : 'buy'}">${esc(side)}</span></div>
        <div class="price-flow">${price(first(row.entry_price, row.entry))} → ${price(first(row.exit_price, row.close_price, row.price))}</div>
        ${tpDots(row)}
        <div class="pnl ${signedClass(profit)}">${money(profit)}</div>
      </div>`;
    }

    function latestTradesPanel() {
      const rows = trades().slice(0, 5);
      const closedToday = first(pnl().closed_trades_count, pnl().trades_count, statsToday().total_trades, rows.length);
      return `<div class="panel">
        <div class="panel-header"><div class="panel-title">Последние сделки</div><span class="chip">Сегодня · ${dash(closedToday)} закрыто</span></div>
        ${errorBlock('trades')}
        ${rows.length ? `<div class="trade-list">${rows.map(tradeRow).join('')}</div>` : `<div class="empty">Сделок пока нет</div>`}
      </div>`;
    }

    function mainBiasRow() {
      const rows = liveBiasRows();
      return rows.find(row => row.symbol === 'NAS100') || rows[0] || null;
    }

    function biasPanel() {
      const row = mainBiasRow();
      if (!row) {
        return `<div class="panel">
          <div class="panel-header"><div class="panel-title">Байес · Live</div><span class="chip">—</span></div>
          ${errorBlock('biasLive')}
          <div class="empty">Байес не рассчитан. Запустите расчёт.</div>
        </div>`;
      }
      const confidence = Math.max(0, Math.min(100, num(row.confidence) || 0));
      const reasons = arr(row.reasons).slice(0, 5);
      const accuracy = obj(obj(liveBiasAccuracy().overall)['30m']).accuracy;
      return `<div class="panel">
        <div class="panel-header"><div class="panel-title">Байес · Live</div><span class="chip">${esc(row.symbol || '—')}</span></div>
        ${errorBlock('biasLive')}
        <div class="bias-hero">
          <div class="bias-direction ${row.direction === 'SHORT' ? 'short' : ''}">${esc(row.direction || '—')}</div>
          <div class="bias-confidence">${dash(row.confidence)}%</div>
        </div>
        <div class="progress"><span style="width:${confidence}%"></span></div>
        <div class="tag-list">
          <span class="tag">${esc(row.strength || '—')}</span>
          <span class="tag">Риск: ${esc(row.risk || '—')}</span>
          ${reasons.map(reason => `<span class="tag">${esc(reason)}</span>`).join('')}
        </div>
        <div style="margin-top:12px;color:var(--text-muted);font-size:10px;">Точность 30д: ${accuracy === null || accuracy === undefined ? '—' : `${accuracy}%`}</div>
        ${pseudoTrend(accuracy || confidence, 'amber')}
      </div>`;
    }

    function riskPanel() {
      const s = stats();
      const risk = obj(lab().risk_damage_analytics);
      const drawdown = first(s.max_drawdown, risk.max_drawdown);
      const pf = first(s.profit_factor, risk.profit_factor);
      const avgR = first(s.avg_r, s.average_r, risk.expectancy_R);
      const riskLevel = String(first(risk.risk_status, liveBias().risk, 'LOW')).toUpperCase();
      const riskTone = riskLevel.includes('HIGH') || riskLevel.includes('CRITICAL') ? 'red-text' : riskLevel.includes('MEDIUM') || riskLevel.includes('WARNING') ? 'amber-text' : 'green-text';
      return `<div class="panel">
        <div class="panel-header"><div class="panel-title">Аналитика · Риск</div><span class="chip">30 дней</span></div>
        ${errorBlock('stats')}
        <div class="risk-list">
          ${riskRow('Win Rate', pct(first(s.win_rate, s.winrate, risk.winrate)), 'green-text')}
          ${riskRow('Profit Factor', dash(pf), 'green-text')}
          ${riskRow('Avg R', avgR === null || avgR === undefined ? '—' : `${Number(avgR).toFixed(2)}R`, 'amber-text')}
          ${riskRow('Max Drawdown', pct(drawdown), num(drawdown) > 10 ? 'red-text' : 'amber-text')}

    function lineChart(points, label='График') {
      const valid = points.filter(point => num(point.value) !== null);
      if (valid.length < 2) return `<div class="empty">Недостаточно истории для графика.</div>`;
      const width = 760, height = 220, pad = 26;
      const values = valid.map(point => Number(point.value));
      const min = Math.min(...values);
      const max = Math.max(...values);
      const span = max - min || 1;
      const coords = valid.map((point, index) => {
        const x = pad + index * ((width - pad * 2) / Math.max(valid.length - 1, 1));
        const y = height - pad - ((Number(point.value) - min) / span) * (height - pad * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
      return `<div class="chart-box"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(label)}">
        <rect width="${width}" height="${height}" fill="#FAFBFC"></rect>
        <line x1="${pad}" y1="${height-pad}" x2="${width-pad}" y2="${height-pad}" stroke="#E5E7EB"></line>
        <polyline points="${coords}" fill="none" stroke="#D97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></polyline>
        <text x="${pad}" y="22" fill="#6B7280" font-size="12">${esc(label)}</text>
      </svg></div>`;
    }

    function isDataOld(value) {
      if (!value) return false;
      const parsed = new Date(String(value).replace(' ', 'T'));
      if (Number.isNaN(parsed.getTime())) return false;
      return (Date.now() - parsed.getTime()) > 15 * 60 * 1000;
    }

    function openPositions() {
      const fromPositions = positions();

    function tradeResult(row) {
      const profit = num(first(row.net_profit, row.profit, row.total_net, row.pnl));

      return 'FLAT';

    function filteredTrades() {
      return trades().filter(row => {
        const periodOk = inSelectedPeriod(row);
        const symbolOk = state.filters.symbol === 'ALL' || row.symbol === state.filters.symbol;
        const resultOk = state.filters.result === 'ALL' || tradeResult(row) === state.filters.result;
        const source = String(first(row.source, row.comment, '—'));
        const sourceOk = state.filters.source === 'ALL' || source === state.filters.source;

      });

    function filterOptions(values, selected) {

      return `${periodSwitcher()}<div class="filter-bar">
        <select id="symbol-filter">${filterOptions(symbols, state.filters.symbol)}</select>

      });
      const rows = [...grouped.entries()].map(([symbol, value]) => ({symbol, value})).sort((a,b) => Math.abs(b.value) - Math.abs(a.value)).slice(0, 10);
      if (!rows.length) return '<div class="empty">Нет данных по символам.</div>';
      const max = Math.max(...rows.map(row => Math.abs(row.value))) || 1;
      return `<div class="bar-list">${rows.map(row => `<div class="bar-row"><b class="symbol">${esc(row.symbol)}</b><div class="bar-track"><div class="bar-fill ${row.value < 0 ? 'negative' : ''}" style="width:${Math.max(4, Math.abs(row.value)/max*100)}%"></div></div><b class="${signedClass(row.value)}">${money(row.value)}</b></div>`).join('')}</div>`;

        }).join('')}</div>` : '<div class="empty">Байес не рассчитан.</div>', '', 'biasLive')}
        <div class="page-grid cols-2">
          ${panel('Точность Live Bias', `<div class="kv-grid">${kv('30m', accuracyPercent(acc['30m']))}${kv('1h', accuracyPercent(acc['1h']))}${kv('2h', accuracyPercent(acc['2h']))}${kv('4h', accuracyPercent(acc['4h']))}</div>`, '', 'biasLiveAccuracy')}
          ${panel('Калибровка', arr(calib.recommended_weight_adjustments).length ? table(['Фактор','Изменение','Причина'], arr(calib.recommended_weight_adjustments).map(item => [esc(first(item.factor, item.type, '—')), esc(item.suggested_change || '—'), esc(item.reason || '—')])) : `<div class="empty">Рекомендаций пока нет. Ручное подтверждение: ${calib.requires_human_approval !== false ? 'да' : 'нет'}</div>`, '', 'biasLiveCalibration')}
        </div>
        ${panel('Факторы Bias', factorTable(), '', 'biasLive')}
        ${panel('Доступность источников', sourceAvailabilityBlock(), '', 'biasLive')}
        ${panel('Pre-Market Bias', arr(pre.symbols).length ? table(['Символ','Bias','Уверенность','Риск','Причины'], arr(pre.symbols).map(row => [esc(row.symbol || '—'), esc(row.bias || '—'), `${dash(row.confidence)}%`, esc(row.macro_risk || pre.macro_risk || '—'), esc(arr(row.reasons).slice(0,3).join(', ') || '—')])) : '<div class="empty">Pre-Market отчёта пока нет.</div>', '', 'bias')}
      </div>`;
    }

    function renderLab() {
      const l = lab();
      const h = labHealth();
      const recs = labRecs();
      const count = Number(first(l.trade_count, h.trade_count, 0));
      if (!count) return panel('Лаборатория стратегии', '<div class="empty">Нет закрытой истории сделок. Импортируй историю MT5.</div>', '', 'lab');
      return `<div class="page-grid">
        ${metricStrip([
          {label:'Сделок', value:dash(count), sub:'закрытая история', badge:`Sample: ${statusRu(first(l.sample_warning, h.sample_warning, 'OK'))}`, tone:'blue', seed:count},
          {label:'Закрытые сделки', value:dash(first(h.closed_trades_total, storage().closed_trades_total)), sub:'storage', badge:'состояние данных', tone:'green', seed:h.closed_trades_total},
          {label:'Ручное подтверждение', value:recs.requires_human_approval ? 'нужно' : '—', sub:'рекомендации', badge:'без автоизменений', tone:'amber', seed:1}
        ])}
        <div class="page-grid cols-2">
          ${panel('Состояние данных', `<div class="stack">${kvRow('Сделок', dash(count))}${kvRow('Sample', statusRu(first(l.sample_warning, h.sample_warning, 'OK')))}${kvRow('Источники данных', arr(first(h.data_sources, l.data_sources)).join(', ') || '—')}${kvRow('Native History', dash(storage().native_history_total))}</div>`, '', 'labHealth')}
          ${panel('Аналитика риска', `<div class="stack">${Object.entries(obj(l.risk_damage_analytics)).slice(0,10).map(([key,value]) => kvRow(key, esc(dash(value)))).join('') || '<div class="empty">Аналитики риска пока нет.</div>'}</div>`, '', 'lab')}
        </div>
        ${panel('Рекомендации', Object.keys(obj(recs.best_candidate_settings_per_symbol)).length ? table(['Символ','Score','Причины'], Object.values(obj(recs.best_candidate_settings_per_symbol)).map(item => [esc(item.symbol || '—'), esc(dash(item.score)), esc(arr(item.reasons).join(', ') || '—')])) : '<div class="empty">Рекомендаций пока нет.</div>', '', 'labRecs')}
      </div>`;
    }

    function renderStorage() {
      const st = storage();
      const safe = st.db_storage === 'render_persistent_disk' && st.db_file_exists && !st.db_warning;
      return `<div class="page-grid">
        ${metricStrip([
          {label:'Persistent DB', value:safe ? 'SAFE' : 'WARNING', sub:dash(st.db_storage), badge:dash(st.db_file_is_writable), tone:safe ? 'green' : 'red', seed:1},
          {label:'Размер базы', value:st.db_file_size ? `${Math.round(Number(st.db_file_size)/1024)} KB` : '—', sub:'SQLite', badge:'persistent disk', tone:'blue', seed:st.db_file_size},
          {label:'Всего сделок', value:dash(st.trades_total), sub:'все источники', badge:`Закрыто: ${dash(st.closed_trades_total)}`, tone:'amber', seed:st.trades_total}
        ])}
        ${panel('Состояние базы', `<div class="kv-grid">
          ${kv('Путь DB', `<span class="mono">${esc(first(st.db_file, st.db_file_path, '—'))}</span>`)}
          ${kv('Тип хранения', esc(dash(st.db_storage)))}
          ${kv('Файл существует', st.db_file_exists ? 'да' : 'нет')}
          ${kv('Запись доступна', esc(dash(st.db_file_is_writable)))}
          ${kv('Native History', dash(st.native_history_total))}
          ${kv('Снимки счёта', dash(st.account_snapshots_total))}
          ${kv('Скриншоты', dash(st.screenshots_total))}
          ${kv('Последняя сделка', dateTime(st.latest_trade_time))}
          ${kv('Последний счёт', dateTime(st.latest_account_time))}
          ${kv('Предупреждения', esc(arr(st.warnings).join(', ') || st.db_warning || '—'))}
        </div>`, '', 'storage')}
      </div>`;
    }

    function renderSignals() {
      const rows = signalRows().filter(inSelectedPeriod);
      const sources = signalSources();
      const evaluations = arr(signalAccuracy().samples);
      const evalById = new Map(evaluations.map(item => [item.signal_id, item]));
      const valid = rows.filter(row => row.verdict === 'VALID_SIGNAL');
      const watch = rows.filter(row => ['WATCH_ONLY','WAIT_CONFIRMATION'].includes(row.verdict));
      const rejected = rows.filter(row => ['REJECTED','DUPLICATE','EXPIRED'].includes(row.verdict));
      const sourceTrust = name => sources.find(source => source.source_name === name)?.trust_score;
      if (!rows.length) return `<div class="page-grid">${panel('Период', periodSwitcher())}${panel('Сигналы', '<div class="empty">Сигналы ещё не обработаны.</div>', periodLabels[state.filters.period], 'signals')}</div>`;
      return `<div class="page-grid">
        ${panel('Период', periodSwitcher())}
        ${metricStrip([
          {label:'Подтверждённые', value:dash(valid.length), sub:'score >= 70', badge:'Подтверждён', tone:'green', seed:valid.length},
          {label:'Наблюдать', value:dash(watch.length), sub:'ожидание', badge:'Наблюдать', tone:'amber', seed:watch.length},
          {label:'Отклонённые', value:dash(rejected.length), sub:'фильтр', badge:'без Telegram spam', tone:'red', seed:rejected.length}
        ])}
        ${panel('Последние сигналы', `<div class="desktop-table">${table(['Время','Символ','Направление','Score','Статус','Источник','Доверие','Результат','Актуален'], rows.slice(0,100).map(row => [dateTime(row.timestamp), esc(row.symbol || '—'), esc(row.direction || '—'), `${dash(row.score)}%`, esc(statusRu(row.verdict)), esc(row.source_name || '—'), dash(sourceTrust(row.source_name)), esc(statusRu(evalById.get(row.signal_id)?.result || 'pending')), `${dash(row.expiry_minutes)}m`]))}</div><div class="mobile-cards"><div class="compact-list">${rows.slice(0,60).map(row => `<div class="compact-card"><div class="compact-head"><div><div class="symbol">${esc(row.symbol || '—')}</div><div class="chip">${esc(statusRu(row.verdict))}</div></div><b class="amber-text">${dash(row.score)}%</b></div><div class="kv-grid">${kv('Направление', esc(row.direction || '—'))}${kv('Источник', esc(row.source_name || '—'))}${kv('Доверие', dash(sourceTrust(row.source_name)))}${kv('Результат', esc(statusRu(evalById.get(row.signal_id)?.result || 'pending')))}</div></div>`).join('')}</div></div>`, periodLabels[state.filters.period], 'signals')}
      </div>`;
    }

    function renderSources() {
      const sources = signalSources();
      return panel('Источники сигналов', sources.length ? table(['Источник','Доверие','Сигналов','Точность','Средний R','Лучшие','Худшие','Последний сигнал'], sources.map(source => [esc(source.source_name || '—'), dash(source.trust_score), dash(source.total_signals), source.winrate === null || source.winrate === undefined ? '—' : `${source.winrate}%`, dash(source.average_R), esc(arr(source.best_symbols).map(item => item.symbol).join(', ') || '—'), esc(arr(source.worst_symbols).map(item => item.symbol).join(', ') || '—'), dateTime(source.last_signal_at)])) : '<div class="empty">Источники сигналов пока не подключены.</div>', '', 'signalSources');
    }

    function renderSettings() {
      const sys = system();
      const st = storage();
      const status = obj(state.data.status);
      return `<div class="page-grid">
        ${metricStrip([
          {label:'Render', value:health().ok ? 'Онлайн' : 'Нет связи', sub:dash(sys.render_service), badge:dateTime(sys.server_time), tone:health().ok ? 'green' : 'red', seed:1},
          {label:'Режим системы', value:dash(first(sys.system_mode, status.system_mode)), sub:'только чтение', badge:'без secrets', tone:'blue', seed:1},
          {label:'Статус базы', value:st.db_storage === 'render_persistent_disk' ? 'SAFE' : 'WARNING', sub:dash(st.db_storage), badge:'persistent', tone:st.db_storage === 'render_persistent_disk' ? 'green' : 'red', seed:1}
        ])}
        <div class="page-grid cols-2">
          ${panel('Система', `<div class="stack">
            ${kvRow('git_commit', `<span class="mono">${esc(sys.git_commit || '—')}</span>`)}
            ${kvRow('git_branch', esc(dash(sys.git_branch)))}
            ${kvRow('dashboard_version', esc(first(sys.dashboard_version, DASHBOARD_VERSION)))}
            ${kvRow('Интервал обновления', `${REFRESH_MS/1000}s`)}
            ${kvRow('uptime', sys.uptime_seconds !== undefined ? `${sys.uptime_seconds}s` : '—')}
          </div>`, '', 'system')}
          ${panel('Статус endpoints', `<div class="stack">${endpointList.map(path => kvRow(path, path.includes('/api/dashboard/') || path === '/api/health' ? 'только чтение' : '—')).join('')}</div>`)}
        </div>
      </div>`;
    }

    function render() {
      state.route = routeById[state.route] ? state.route : initialRoute();
      const route = routeById[state.route];
      $('page-title').textContent = route.label;
      $('topbar-bias').textContent = topbarBiasText();
      const activeBots = bots().filter(bot => String(first(bot.status, bot.state, '')).toLowerCase() !== 'paused').length || bots().length;
      $('sidebar-bots').textContent = `Боты: ${dash(activeBots)}`;
      renderNav();
      renderBottomNav();
      if (state.loading && !state.lastUpdate) {
        $('content').innerHTML = '<div class="loading">Загрузка данных...</div>';
        return;
      }
      const renderers = {
        overview: renderOverview,
        portfolio: renderPortfolio,
        positions: renderPositions,
        trades: renderTrades,
        history: renderHistory,
        analytics: renderAnalytics,
        risk: renderRisk,
        bias: renderBias,
        lab: renderLab,
        storage: renderStorage,
        signals: renderSignals,
        sources: renderSources,
        settings: renderSettings
      };
      $('content').innerHTML = (renderers[state.route] || renderOverview)();
      bindPageControls();
    }

    function bindPageControls() {
      const symbol = $('symbol-filter');
      if (symbol) symbol.addEventListener('change', event => { state.filters.symbol = event.target.value; render(); });
      const result = $('result-filter');
      if (result) result.addEventListener('change', event => { state.filters.result = event.target.value; render(); });
      const source = $('source-filter');
      if (source) source.addEventListener('change', event => { state.filters.source = event.target.value; render(); });
      document.querySelectorAll('[data-period]').forEach(button => {
        button.addEventListener('click', () => {
          state.filters.period = button.dataset.period || 'day';
          render();
        });
      });
    }

    function topbarBiasText() {
      const row = mainBiasRow();
      return row ? `Байес: ${row.direction || '—'} ${dash(row.confidence)}%` : 'Байес: —';
    }

    function tickClock() {
      const now = new Date();
      $('clock').textContent = now.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
      $('sidebar-time').textContent = now.toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
    }

    window.addEventListener('hashchange', () => {
      const next = window.location.hash.replace('#', '').replace('/', '');
      state.route = routeById[next] ? next : 'overview';
      render();
    });

    state.route = initialRoute();
    tickClock();
    setInterval(tickClock, 1000);
    $('refresh-button').addEventListener('click', refreshAll);
    refreshAll();
    setInterval(refreshAll, REFRESH_MS);
  </script>
</body>
</html>
