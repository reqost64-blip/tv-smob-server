<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MT5 Trading Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #07090d;
      --panel:        #0c1018;
      --panel-alt:    #0a0e14;
      --border:       #1a2233;
      --border-hi:    #243040;
      --green:        #00ff88;
      --red:          #ff4466;
      --blue:         #00aaff;
      --yellow:       #ffcc00;
      --text:         #8fa0b4;
      --text-hi:      #ccdde8;
      --dim:          #3a4f5e;
      --font:         'JetBrains Mono', 'Courier New', monospace;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 12px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: var(--panel);
      border-bottom: 1px solid var(--border-hi);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--green);
      letter-spacing: 0.12em;
    }
    .header-title span { color: var(--dim); }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 11px;
      color: var(--dim);
    }

    .header-meta #last-updated { color: var(--text-hi); }

    /* ── Status bar ── */
    .status-bar {
      background: var(--panel-alt);
      border-bottom: 1px solid var(--border);
      padding: 5px 20px;
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 11px;
      flex-wrap: wrap;
    }

    .sb-item { display: flex; align-items: center; gap: 6px; }
    .sb-label { color: var(--dim); }

    /* ── Layout ── */
    .container {
      padding: 16px 20px;
      display: grid;
      gap: 14px;
    }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

    @media (max-width: 960px)  { .row-2 { grid-template-columns: 1fr; } }
    @media (max-width: 1100px) { .row-3 { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 700px)  { .row-3 { grid-template-columns: 1fr; } }

    /* ── Panel ── */
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
    }

    .panel-hd {
      background: var(--panel-alt);
      padding: 7px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--blue);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .panel-badge {
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 0.06em;
    }

    .panel-body { padding: 12px 14px; }

    /* ── Stat grid ── */
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 16px;
    }

    .stat { display: flex; flex-direction: column; gap: 2px; }

    .stat-lbl {
      font-size: 9px;
      color: var(--dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .stat-val {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-hi);
    }

    .stat-val.green  { color: var(--green); }
    .stat-val.red    { color: var(--red); }
    .stat-val.blue   { color: var(--blue); }
    .stat-val.yellow { color: var(--yellow); }
    .stat-val.sm     { font-size: 12px; }

    .source-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .source-tab {
      background: var(--panel-alt);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font);
      font-size: 10px;
      padding: 4px 8px;
      cursor: pointer;
    }

    .source-tab.active {
      color: var(--green);
      border-color: var(--green);
      background: rgba(0,255,136,.08);
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(90px, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }

    @media (max-width: 900px) { .metric-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 540px) { .metric-grid { grid-template-columns: repeat(2, 1fr); } }

    .metric-card {
      background: var(--panel-alt);
      border: 1px solid var(--border);
      padding: 8px;
    }

    /* ── PnL hero ── */
    .pnl-hero { text-align: center; padding: 8px 0 6px; }

    .pnl-big {
      font-size: 30px;
      font-weight: 700;
      line-height: 1;
    }
    .pnl-big.green  { color: var(--green); }
    .pnl-big.red    { color: var(--red); }
    .pnl-big.dim    { color: var(--dim); }

    .pnl-sub { font-size: 9px; color: var(--dim); letter-spacing: 0.1em; margin-top: 4px; }

    .divider { border: none; border-top: 1px solid var(--border); margin: 10px 0; }

    /* ── Win rate bar ── */
    .wr-bar {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 10px;
      overflow: hidden;
    }
    .wr-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--green), #00cc66);
      border-radius: 2px;
    }

    /* ── Table ── */
    .tbl-wrap { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; font-size: 11px; }

    th {
      text-align: left;
      padding: 5px 10px;
      color: var(--dim);
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 9px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 5px 10px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tr:last-child td   { border-bottom: none; }
    tbody tr:hover td  { background: rgba(0,170,255,0.03); }

    tfoot td { font-size: 11px; padding: 6px 10px; }

    .c-hi  { color: var(--text-hi); font-weight: 500; }
    .c-green { color: var(--green); }
    .c-red   { color: var(--red); }
    .c-blue  { color: var(--blue); }
    .c-dim   { color: var(--dim); }

    /* ── Bot cards ── */
    .bots-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 10px;
      padding: 12px 14px;
    }

    .bot-card {
      background: var(--panel-alt);
      border: 1px solid var(--border);
      border-left: 3px solid var(--dim);
      border-radius: 2px;
      padding: 10px 12px;
    }
    .bot-card.online   { border-left-color: var(--green); }
    .bot-card.offline  { border-left-color: var(--dim); }
    .bot-card.disabled { border-left-color: var(--red); }

    .bot-symbol { font-size: 13px; font-weight: 700; color: var(--blue); margin-bottom: 2px; }
    .bot-id     { font-size: 10px; color: var(--dim); margin-bottom: 7px; }

    .bot-badges { display: flex; gap: 4px; margin-bottom: 7px; }

    .bot-rows   { display: flex; flex-direction: column; gap: 2px; }

    .bot-row {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
    }
    .bot-row .lbl { color: var(--dim); }

    /* ── Badges ── */
    .badge {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 2px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      border: 1px solid transparent;
    }
    .badge-green  { background: rgba(0,255,136,.10); color: var(--green); border-color: rgba(0,255,136,.25); }
    .badge-red    { background: rgba(255,68,102,.10); color: var(--red);   border-color: rgba(255,68,102,.25); }
    .badge-blue   { background: rgba(0,170,255,.10); color: var(--blue);  border-color: rgba(0,170,255,.25); }
    .badge-dim    { background: rgba(58,79,94,.15);  color: var(--dim);   border-color: var(--border); }

    /* ── Dot indicator ── */
    .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .dot-green { background: var(--green); box-shadow: 0 0 5px var(--green); }
    .dot-red   { background: var(--red); }
    .dot-dim   { background: var(--dim); }

    /* ── Spinner ── */
    .spin {
      display: inline-block;
      width: 11px;
      height: 11px;
      border: 2px solid var(--border-hi);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin .75s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── State boxes ── */
    .state {
      padding: 22px;
      text-align: center;
      color: var(--dim);
      font-size: 11px;
    }
    .state.err  { color: var(--red); }
    .state.warn { color: var(--yellow); }

    /* ── Scanline overlay ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 3px,
        rgba(0,170,255,.008) 3px, rgba(0,170,255,.008) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>

<!-- ── Header ─────────────────────────────────────────────────────────────── -->
<div class="header">
  <div class="header-title">▸ MT5 <span>//</span> TRADING DASHBOARD</div>
  <div class="header-meta">
    <div id="refresh-wrap" style="display:flex;align-items:center;gap:6px;">
      <span id="spin-icon" class="spin" style="display:none;"></span>
      <span>REFRESH <span id="countdown" style="color:var(--green)">30</span>s</span>
    </div>
    <div>UPDATED: <span id="last-updated">—</span></div>
  </div>
</div>

<!-- ── Status bar ─────────────────────────────────────────────────────────── -->
<div class="status-bar">
  <div class="sb-item">
    <span class="sb-label">MODE</span>
    <span id="sb-mode" style="color:var(--blue)">—</span>
  </div>
  <div class="sb-item">
    <span class="sb-label">TRADING</span>
    <span id="sb-trading">—</span>
  </div>
  <div class="sb-item">
    <span class="sb-label">BOTS ONLINE</span>
    <span id="sb-bots">—</span>
  </div>
  <div class="sb-item">
    <span class="sb-label">LAST HEARTBEAT</span>
    <span id="sb-hb">—</span>
  </div>
</div>

<!-- ── Content ────────────────────────────────────────────────────────────── -->
<div class="container">

  <!-- Row 1: Account + PnL -->
  <div class="row-2">

    <div class="panel">
      <div class="panel-hd">
        <span class="panel-title">Account</span>
        <span class="panel-badge" id="acct-badge">—</span>
      </div>
      <div class="panel-body" id="acct-panel"><div class="state"><span class="spin"></span></div></div>
    </div>

    <div class="panel">
      <div class="panel-hd">
        <span class="panel-title">P&amp;L Today</span>
        <span class="panel-badge">TODAY</span>
      </div>
      <div class="panel-body" id="pnl-panel"><div class="state"><span class="spin"></span></div></div>
    </div>

  </div>

  <!-- Row 2: Bots -->
  <div class="panel">
    <div class="panel-hd">
      <span class="panel-title">Bot Status</span>
      <span class="panel-badge" id="bots-badge">—</span>
    </div>
    <div id="bots-panel"><div class="state"><span class="spin"></span></div></div>
  </div>

  <!-- Row 3: Open Positions -->
  <div class="panel">
    <div class="panel-hd">
      <span class="panel-title">Open Positions</span>
      <span class="panel-badge" id="pos-badge">—</span>
    </div>
    <div id="pos-panel"><div class="state"><span class="spin"></span></div></div>
  </div>

  <!-- Row 4: Trades + Performance -->
  <div class="row-2">

    <div class="panel">
      <div class="panel-hd">
        <span class="panel-title">Recent Trades</span>
        <span class="panel-badge" id="trades-badge">TODAY</span>
      </div>
      <div id="trades-panel"><div class="state"><span class="spin"></span></div></div>
    </div>

    <div class="panel">
      <div class="panel-hd">
        <span class="panel-title">Performance</span>
        <span class="panel-badge">TODAY · PER BOT</span>
      </div>
      <div id="perf-panel"><div class="state"><span class="spin"></span></div></div>
    </div>

  </div>

  <!-- Row 5: Journal -->
  <div class="panel">
    <div class="panel-hd">
      <span class="panel-title">Journal</span>
      <span class="panel-badge" id="journal-badge">TODAY</span>
    </div>
    <div id="journal-panel"><div class="state"><span class="spin"></span></div></div>
  </div>

</div><!-- /container -->

<script>
'use strict';

const BASE    = 'https://tv-smob-server-1.onrender.com';
const REFRESH = 30;
let tradesSource = 'bot';
let statsSource = 'bot';

// ── Helpers ──────────────────────────────────────────────────────────────────

const el = id => document.getElementById(id);

function fmt(v, d = 2) {
  if (v == null) return '—';
  return Number(v).toFixed(d);
}

function fmtMoney(v) {
  if (v == null) return '—';
  const n = Number(v);
  const abs = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (n >= 0 ? '+' : '−') + abs;
}

function fmtNum(v) {
  if (v == null) return '—';
  return Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function pnlCls(v) {
  if (v == null) return '';
  return Number(v) >= 0 ? 'c-green' : 'c-red';
}

function pnlBig(v) {
  if (v == null) return 'dim';
  const n = Number(v);
  if (n > 0) return 'green';
  if (n < 0) return 'red';
  return 'dim';
}

function timeAgo(iso) {
  if (!iso) return '—';
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 0)    return 'just now';
  if (s < 60)   return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  return Math.floor(s / 3600) + 'h ago';
}

function fmtTime(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  } catch { return String(iso); }
}

function fmtDateTime(iso) {
  if (!iso) return '—';
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('en-GB', { month: 'short', day: '2-digit' })
      + ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  } catch { return String(iso); }
}

function sideOf(t) {
  const s = (t.side || t.type || '').toString().toLowerCase();
  if (s === 'buy'  || s === '0') return 'BUY';
  if (s === 'sell' || s === '1') return 'SELL';
  return s.toUpperCase() || '—';
}

function sourceIcon(src) {
  const s = (src || 'bot').toString().toLowerCase();
  if (s === 'backtest') return '📊';
  if (s === 'manual' || s === 'all') return '👤';
  return '🤖';
}

function sourceTabs(active, target) {
  const options = target === 'stats'
    ? [['bot', '🤖 Только бот'], ['all', '👤 Все сделки'], ['backtest', '📊 Бэктест']]
    : [['bot', '🤖 Бот'], ['all', '👤 Все сделки'], ['backtest', '📊 Бэктест']];
  return '<div class="source-tabs">' + options.map(([value, label]) =>
    `<button class="source-tab ${active === value ? 'active' : ''}" onclick="set${target === 'stats' ? 'Stats' : 'Trades'}Source('${value}')">${label}</button>`
  ).join('') + '</div>';
}

function summarizeTrades(trades) {
  const profits = trades.map(t => Number(t.profit_money ?? t.profit ?? t.pnl ?? 0));
  const wins = profits.filter(v => v > 0);
  const losses = profits.filter(v => v < 0);
  const grossProfit = wins.reduce((a, b) => a + b, 0);
  const grossLoss = losses.reduce((a, b) => a + b, 0);
  return {
    total: trades.length,
    wins: wins.length,
    losses: losses.length,
    winRate: trades.length ? wins.length / trades.length * 100 : 0,
    totalPnl: profits.reduce((a, b) => a + b, 0),
    profitFactor: grossLoss < 0 ? grossProfit / Math.abs(grossLoss) : 0
  };
}

function metricCards(items) {
  return '<div class="metric-grid">' + items.map(item => `
    <div class="metric-card">
      <div class="stat-lbl">${item.label}</div>
      <div class="stat-val ${item.cls || ''}">${item.value}</div>
    </div>
  `).join('') + '</div>';
}

// ── API ───────────────────────────────────────────────────────────────────────

async function apiFetch(path) {
  const res = await fetch(BASE + path, { signal: AbortSignal.timeout(12000) });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

// ── State helpers ─────────────────────────────────────────────────────────────

function setLoading(target) {
  target.innerHTML = '<div class="state"><span class="spin"></span></div>';
}

function setEmpty(target, msg = 'No data yet') {
  target.innerHTML = '<div class="state">' + msg + '</div>';
}

function setError(target, msg = 'Failed to load') {
  target.innerHTML = '<div class="state err">⚠ ' + msg + '</div>';
}

// ── Renderers ─────────────────────────────────────────────────────────────────

function renderStatus(d) {
  el('sb-mode').textContent = d.system_mode || '—';

  const tr = d.trading_enabled;
  el('sb-trading').innerHTML = tr == null
    ? '—'
    : tr
      ? '<span class="dot dot-green"></span> <span class="c-green">ENABLED</span>'
      : '<span class="dot dot-red"></span> <span class="c-red">DISABLED</span>';

  el('sb-bots').innerHTML =
    '<span class="c-green">' + (d.bots_online || 0) + '</span>' +
    '<span class="c-dim">/' + (d.bots_total || 0) + ' online · </span>' +
    '<span class="c-blue">' + (d.bots_enabled || 0) + '</span>' +
    '<span class="c-dim"> enabled</span>';

  el('sb-hb').innerHTML = d.last_heartbeat_at
    ? '<span class="c-green">' + timeAgo(d.last_heartbeat_at) + '</span>'
    : '<span class="c-dim">none</span>';
}

function renderAccount(d) {
  const panel = el('acct-panel');
  const a = d.account;
  if (!a) { setEmpty(panel); return; }

  el('acct-badge').textContent = a.account_id || a.login || '';

  const cur = (a.currency ? a.currency + ' ' : '');
  const ml = Number(a.margin_level || 0);

  panel.innerHTML = `
    <div class="stat-grid">
      <div class="stat">
        <div class="stat-lbl">Balance</div>
        <div class="stat-val">${cur}${fmtNum(a.balance)}</div>
      </div>
      <div class="stat">
        <div class="stat-lbl">Equity</div>
        <div class="stat-val blue">${cur}${fmtNum(a.equity)}</div>
      </div>
      <div class="stat">
        <div class="stat-lbl">Margin</div>
        <div class="stat-val sm">${cur}${fmtNum(a.margin)}</div>
      </div>
      <div class="stat">
        <div class="stat-lbl">Free Margin</div>
        <div class="stat-val sm">${cur}${fmtNum(a.free_margin ?? a.margin_free)}</div>
      </div>
      <div class="stat">
        <div class="stat-lbl">Margin Level</div>
        <div class="stat-val ${ml > 200 ? 'green' : ml > 100 ? 'yellow' : 'red'}">${fmt(ml, 1)}%</div>
      </div>
      <div class="stat">
        <div class="stat-lbl">Floating P&amp;L</div>
        <div class="stat-val ${pnlBig(a.profit)}">${fmtMoney(a.profit)}</div>
      </div>
    </div>
    ${a.broker ? `<div style="margin-top:10px;font-size:9px;color:var(--dim)">${a.broker}${a.server ? ' · ' + a.server : ''}</div>` : ''}
  `;
}

function renderPnl(d) {
  const panel = el('pnl-panel');
  const p = d.pnl;
  if (!p || !Object.keys(p).length) { setEmpty(panel); return; }

  const closed   = p.closed_pnl ?? p.net_pnl ?? 0;
  const trades   = p.trades_count ?? 0;
  const wins     = p.wins ?? 0;
  const losses   = p.losses ?? 0;
  const wr       = trades > 0 ? (wins / trades * 100) : 0;

  panel.innerHTML = `
    <div class="pnl-hero">
      <div class="pnl-big ${pnlBig(closed)}">${fmtMoney(closed)}</div>
      <div class="pnl-sub">CLOSED P&amp;L TODAY</div>
    </div>
    <hr class="divider">
    <div class="stat-grid">
      <div class="stat">
        <div class="stat-lbl">Trades</div>
        <div class="stat-val">${trades}</div>
      </div>
      <div class="stat">
        <div class="stat-lbl">Win Rate</div>
        <div class="stat-val ${wr >= 50 ? 'green' : 'red'}">${wr.toFixed(0)}%</div>
      </div>
      <div class="stat">
        <div class="stat-lbl">Wins / Losses</div>
        <div class="stat-val sm"><span class="c-green">${wins}</span> / <span class="c-red">${losses}</span></div>
      </div>
      <div class="stat">
        <div class="stat-lbl">Best / Worst</div>
        <div class="stat-val sm">
          <span class="c-green">${p.best_trade != null ? fmtMoney(p.best_trade) : '—'}</span>
          &nbsp;/&nbsp;
          <span class="c-red">${p.worst_trade != null ? fmtMoney(p.worst_trade) : '—'}</span>
        </div>
      </div>
    </div>
    <div class="wr-bar"><div class="wr-fill" style="width:${wr}%"></div></div>
  `;
}

function renderBots(d) {
  const panel = el('bots-panel');
  const bots  = d.bots || [];

  el('bots-badge').textContent = bots.length + ' bot' + (bots.length !== 1 ? 's' : '');

  if (!bots.length) { setEmpty(panel, 'No bots registered'); return; }

  const cards = bots.map(b => {
    const enabled  = b.enabled !== false;
    const online   = b.online_status === 'online';
    const cardCls  = !enabled ? 'disabled' : online ? 'online' : 'offline';

    const enBadge  = enabled
      ? '<span class="badge badge-green">ENABLED</span>'
      : '<span class="badge badge-red">DISABLED</span>';
    const onBadge  = online
      ? '<span class="badge badge-green">ONLINE</span>'
      : '<span class="badge badge-dim">OFFLINE</span>';

    const pos = b.has_position && b.active_position
      ? `<div class="bot-row"><span class="lbl">Position</span><span class="c-blue">${b.active_position.side || ''} ${b.active_position.volume || ''} lots</span></div>`
      : '';

    const reason = b.reason
      ? `<div class="bot-row"><span class="lbl">Reason</span><span class="c-red">${b.reason}</span></div>`
      : '';

    return `
      <div class="bot-card ${cardCls}">
        <div class="bot-symbol">${b.symbol || b.asset || '—'}</div>
        <div class="bot-id">${b.bot_id || '—'}</div>
        <div class="bot-badges">${enBadge}${onBadge}</div>
        <div class="bot-rows">
          <div class="bot-row"><span class="lbl">Heartbeat</span><span>${timeAgo(b.last_heartbeat_at)}</span></div>
          <div class="bot-row"><span class="lbl">Last event</span><span>${b.last_event_type || '—'}</span></div>
          ${pos}${reason}
        </div>
      </div>
    `;
  }).join('');

  panel.innerHTML = `<div class="bots-grid">${cards}</div>`;
}

function renderPositions(d) {
  const panel = el('pos-panel');
  const rows  = d.positions || [];

  el('pos-badge').textContent = rows.length + ' open';

  if (!rows.length) { setEmpty(panel, 'No open positions'); return; }

  const trs = rows.map(p => {
    const side  = sideOf(p);
    const sCls  = side === 'BUY' ? 'c-green' : 'c-red';
    const pnl   = p.profit ?? p.unrealized_pnl ?? p.pnl ?? null;
    return `
      <tr>
        <td class="c-hi">${p.symbol || p.asset || '—'}</td>
        <td class="${sCls}">${side}</td>
        <td>${fmt(p.volume ?? p.lots, 2)}</td>
        <td>${fmt(p.price_open ?? p.open_price, 5)}</td>
        <td class="c-blue">${fmt(p.price_current ?? p.current_price, 5)}</td>
        <td class="${pnlCls(pnl)}">${fmtMoney(pnl)}</td>
        <td class="c-dim">${p.bot_id ?? p.magic ?? '—'}</td>
        <td class="c-dim">${fmtDateTime(p.time ?? p.open_time ?? p.opened_at)}</td>
      </tr>
    `;
  }).join('');

  panel.innerHTML = `
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>Symbol</th><th>Side</th><th>Volume</th>
          <th>Open</th><th>Current</th><th>P&amp;L</th>
          <th>Bot</th><th>Opened</th>
        </tr></thead>
        <tbody>${trs}</tbody>
      </table>
    </div>
  `;
}

function renderTrades(d) {
  const panel  = el('trades-panel');
  const trades = d.trades || [];

  el('trades-badge').textContent = trades.length + ' trade' + (trades.length !== 1 ? 's' : '');

  const summary = summarizeTrades(trades);
  const cards = metricCards([
    { label: 'Total', value: d.total ?? summary.total },
    { label: 'Wins', value: summary.wins, cls: 'green' },
    { label: 'Losses', value: summary.losses, cls: 'red' },
    { label: 'Win Rate', value: summary.winRate.toFixed(0) + '%', cls: summary.winRate >= 50 ? 'green' : 'red' },
    { label: 'Total P&L', value: fmtMoney(summary.totalPnl), cls: pnlBig(summary.totalPnl) },
    { label: 'Profit Factor', value: summary.profitFactor.toFixed(2), cls: 'blue' },
  ]);

  if (!trades.length) {
    panel.innerHTML = sourceTabs(tradesSource, 'trades') + cards + '<div class="state">No trades today</div>';
    return;
  }

  const trs = trades.map(t => {
    const side = sideOf(t);
    const sCls = side === 'BUY' ? 'c-green' : 'c-red';
    const pnl  = t.profit_money ?? t.profit ?? t.pnl ?? null;
    return `
      <tr>
        <td>${sourceIcon(t.source)}</td>
        <td class="c-hi">${t.symbol || t.asset || '—'}</td>
        <td class="${sCls}">${side}</td>
        <td>${fmt(t.volume ?? t.lots, 2)}</td>
        <td>${fmt(t.price_open ?? t.open_price ?? t.entry_price, 5)}</td>
        <td>${fmt(t.price_close ?? t.close_price ?? t.exit_price, 5)}</td>
        <td class="${pnlCls(pnl)}">${fmtMoney(pnl)}</td>
        <td class="c-dim">${t.bot_id || '—'}</td>
        <td class="c-dim">${fmtTime(t.time_close ?? t.closed_at ?? t.close_time)}</td>
      </tr>
    `;
  }).join('');

  panel.innerHTML = `
    ${sourceTabs(tradesSource, 'trades')}
    ${cards}
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>Src</th><th>Symbol</th><th>Side</th><th>Volume</th>
          <th>Open</th><th>Close</th><th>P&amp;L</th>
          <th>Bot</th><th>Closed</th>
        </tr></thead>
        <tbody>${trs}</tbody>
      </table>
    </div>
  `;
}

function renderPerformance(d) {
  const panel = el('perf-panel');
  const stats = d.stats || {};

  panel.innerHTML = `
    ${sourceTabs(statsSource, 'stats')}
    ${metricCards([
      { label: 'Total', value: stats.total_trades ?? 0 },
      { label: 'Wins', value: stats.wins ?? 0, cls: 'green' },
      { label: 'Losses', value: stats.losses ?? 0, cls: 'red' },
      { label: 'Win Rate', value: fmt(stats.win_rate ?? 0, 0) + '%', cls: Number(stats.win_rate || 0) >= 50 ? 'green' : 'red' },
      { label: 'Total P&L', value: fmtMoney(stats.total_pnl ?? 0), cls: pnlBig(stats.total_pnl ?? 0) },
      { label: 'Profit Factor', value: fmt(stats.profit_factor ?? 0, 2), cls: 'blue' },
    ])}
    <div class="stat-grid">
      <div class="stat"><div class="stat-lbl">Best Trade</div><div class="stat-val green">${stats.best_trade != null ? fmtMoney(stats.best_trade) : '—'}</div></div>
      <div class="stat"><div class="stat-lbl">Worst Trade</div><div class="stat-val red">${stats.worst_trade != null ? fmtMoney(stats.worst_trade) : '—'}</div></div>
      <div class="stat"><div class="stat-lbl">Average</div><div class="stat-val">${stats.avg_trade != null ? fmtMoney(stats.avg_trade) : '—'}</div></div>
      <div class="stat"><div class="stat-lbl">Avg R</div><div class="stat-val blue">${stats.avg_r != null ? fmt(stats.avg_r, 2) + 'R' : '—'}</div></div>
    </div>
  `;
}

function renderJournal(d) {
  const panel   = el('journal-panel');
  const entries = d.journal || [];

  el('journal-badge').textContent = entries.length + ' entr' + (entries.length !== 1 ? 'ies' : 'y');

  if (!entries.length) { setEmpty(panel, 'No journal entries today'); return; }

  const trs = entries.slice(0, 100).map(e => {
    const ev = (e.event_type || e.type || '').toLowerCase();
    let cls = 'c-dim';
    if (/open|buy|entry/.test(ev))          cls = 'c-green';
    else if (/close|sell|loss|stop/.test(ev)) cls = 'c-red';
    else if (/tp|profit|win/.test(ev))       cls = 'c-green';
    else if (/be|breakeven/.test(ev))        cls = 'c-blue';

    const detail = e.detail || e.details || e.message || e.comment || '';
    return `
      <tr>
        <td class="c-dim">${fmtTime(e.timestamp ?? e.created_at ?? e.time)}</td>
        <td class="c-blue">${e.bot_id || '—'}</td>
        <td class="${cls}">${ev || '—'}</td>
        <td style="max-width:320px;overflow:hidden;text-overflow:ellipsis">${detail}</td>
      </tr>
    `;
  }).join('');

  panel.innerHTML = `
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>Time</th><th>Bot</th><th>Event</th><th>Details</th>
        </tr></thead>
        <tbody>${trs}</tbody>
      </table>
    </div>
  `;
}

// ── Main fetch ────────────────────────────────────────────────────────────────

function setTradesSource(source) {
  tradesSource = source;
  fetchAll().then(startCountdown);
}

function setStatsSource(source) {
  statsSource = source;
  fetchAll().then(startCountdown);
}

async function fetchAll() {
  el('spin-icon').style.display = 'inline-block';

  const [statusR, accountR, pnlR, botsR, posR, tradesR, perfR, journalR] =
    await Promise.allSettled([
      apiFetch('/api/dashboard/status'),
      apiFetch('/api/dashboard/account'),
      apiFetch('/api/dashboard/pnl?period=today'),
      apiFetch('/api/dashboard/bots'),
      apiFetch('/api/dashboard/positions'),
      apiFetch('/api/dashboard/trades?source=' + encodeURIComponent(tradesSource) + '&period=today&limit=50'),
      apiFetch('/api/dashboard/stats?source=' + encodeURIComponent(statsSource) + '&period=week&asset=ALL'),
      apiFetch('/api/dashboard/journal?period=today&limit=100'),
    ]);

  el('spin-icon').style.display = 'none';
  el('last-updated').textContent = new Date().toLocaleTimeString('en-GB');

  if (statusR.status === 'fulfilled'  && statusR.value.ok)  renderStatus(statusR.value);

  if (accountR.status === 'fulfilled' && accountR.value.ok) renderAccount(accountR.value);
  else setError(el('acct-panel'), 'Account unavailable');

  if (pnlR.status === 'fulfilled'     && pnlR.value.ok)     renderPnl(pnlR.value);
  else setError(el('pnl-panel'), 'P&L unavailable');

  if (botsR.status === 'fulfilled'    && botsR.value.ok)    renderBots(botsR.value);
  else setError(el('bots-panel'), 'Bots unavailable');

  if (posR.status === 'fulfilled'     && posR.value.ok)     renderPositions(posR.value);
  else setError(el('pos-panel'), 'Positions unavailable');

  if (tradesR.status === 'fulfilled'  && tradesR.value.ok)  renderTrades(tradesR.value);
  else setError(el('trades-panel'), 'Trades unavailable');

  if (perfR.status === 'fulfilled'    && perfR.value.ok)    renderPerformance(perfR.value);
  else setError(el('perf-panel'), 'Performance unavailable');

  if (journalR.status === 'fulfilled' && journalR.value.ok) renderJournal(journalR.value);
  else setError(el('journal-panel'), 'Journal unavailable');
}

// ── Countdown + auto-refresh ──────────────────────────────────────────────────

let countdown = REFRESH;
let timer     = null;

function startCountdown() {
  countdown = REFRESH;
  clearInterval(timer);
  timer = setInterval(() => {
    countdown--;
    el('countdown').textContent = countdown;
    if (countdown <= 0) {
      clearInterval(timer);
      fetchAll().then(startCountdown);
    }
  }, 1000);
}

// ── Boot ──────────────────────────────────────────────────────────────────────

fetchAll().then(startCountdown);
</script>
</body>
</html>
